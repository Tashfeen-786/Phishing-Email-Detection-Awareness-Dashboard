<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1210" viewBox="0 0 1160 1210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{stroke-width:1.6;rx:9}
      .t{font-size:14px;font-weight:600;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .mono{font-family:Consolas,Menlo,monospace;font-size:11px;fill:#334155}
      .lbl{font-size:12px;font-weight:700;fill:#1e293b}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .warn{font-size:10.5px;font-weight:700;fill:#b91c1c}
      .hdr{font-size:10px;font-weight:700;fill:#64748b;letter-spacing:1.3px}
    </style>
  </defs>

  <rect width="1160" height="1210" fill="#f8fafc"/>
  <text x="580" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Phishing Email Detection &amp; Awareness Dashboard</text>
  <text x="580" y="60" text-anchor="middle" font-size="13" fill="#64748b">Detection pipeline — every stage is local, static and explainable</text>

  <!-- INPUT -->
  <text x="60" y="94" class="hdr">INPUT</text>
  <rect x="330" y="102" width="500" height="52" class="box" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="580" y="124" text-anchor="middle" class="t">Email input</text>
  <text x="580" y="142" text-anchor="middle" class="mono">sender · subject · body · urls · attachment_name</text>
  <path class="ln" d="M580 154 L580 182"/>

  <!-- PREPROCESSING -->
  <text x="60" y="206" class="hdr">PREPARE</text>
  <rect x="330" y="184" width="500" height="54" class="box" fill="#eef2ff" stroke="#818cf8"/>
  <text x="580" y="206" text-anchor="middle" class="t">Preprocessing</text>
  <text x="580" y="224" text-anchor="middle" class="s">normalise · strip control chars · split sender · extract URLs</text>

  <path class="ln" d="M580 238 L580 258 L145 258 L145 292"/>
  <path class="ln" d="M580 238 L580 258 L435 258 L435 292"/>
  <path class="ln" d="M580 238 L580 258 L725 258 L725 292"/>
  <path class="ln" d="M580 238 L580 258 L1015 258 L1015 292"/>

  <!-- ANALYZERS -->
  <text x="60" y="288" class="hdr">ANALYSE</text>
  <rect x="40" y="294" width="210" height="150" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="145" y="316" text-anchor="middle" class="t">Sender</text>
  <text x="145" y="333" text-anchor="middle" class="mono">analyze_sender()</text>
  <text x="145" y="355" text-anchor="middle" class="s">format validity</text>
  <text x="145" y="372" text-anchor="middle" class="s">look-alike (edit distance)</text>
  <text x="145" y="389" text-anchor="middle" class="s">action-word compounds</text>
  <text x="145" y="406" text-anchor="middle" class="s">digit substitution</text>
  <text x="145" y="423" text-anchor="middle" class="s">subdomain depth</text>

  <rect x="330" y="294" width="210" height="150" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="435" y="316" text-anchor="middle" class="t">Content</text>
  <text x="435" y="333" text-anchor="middle" class="mono">analyze_email_content()</text>
  <text x="435" y="355" text-anchor="middle" class="s">urgency · threat · reward</text>
  <text x="435" y="372" text-anchor="middle" class="s">credential request</text>
  <text x="435" y="389" text-anchor="middle" class="s">financial pressure</text>
  <text x="435" y="406" text-anchor="middle" class="s">generic greeting</text>
  <text x="435" y="423" text-anchor="middle" class="s">shouting · punctuation</text>

  <rect x="620" y="294" width="210" height="150" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="725" y="316" text-anchor="middle" class="t">URL</text>
  <text x="725" y="333" text-anchor="middle" class="mono">analyze_url()</text>
  <text x="725" y="355" text-anchor="middle" class="s">raw IP · no HTTPS</text>
  <text x="725" y="372" text-anchor="middle" class="s">shortener · subdomains</text>
  <text x="725" y="389" text-anchor="middle" class="s">keyword in path · @ trick</text>
  <text x="725" y="406" text-anchor="middle" class="s">punycode · length</text>
  <text x="725" y="428" text-anchor="middle" class="warn">STATIC STRINGS ONLY</text>

  <rect x="910" y="294" width="210" height="150" class="box" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1015" y="316" text-anchor="middle" class="t">Attachment</text>
  <text x="1015" y="333" text-anchor="middle" class="mono">analyze_attachment()</text>
  <text x="1015" y="355" text-anchor="middle" class="s">executable · script</text>
  <text x="1015" y="372" text-anchor="middle" class="s">macro Office · archive</text>
  <text x="1015" y="389" text-anchor="middle" class="s">double extension</text>
  <text x="1015" y="406" text-anchor="middle" class="s">RTL-override trick</text>
  <text x="1015" y="428" text-anchor="middle" class="warn">FILENAME ONLY</text>

  <path class="ln" d="M145 444 L145 470 L580 470 L580 498"/>
  <path class="ln" d="M435 444 L435 470"/>
  <path class="ln" d="M725 444 L725 470"/>
  <path class="ln" d="M1015 444 L1015 470 L580 470"/>

  <!-- FEATURES -->
  <text x="60" y="522" class="hdr">EXTRACT</text>
  <rect x="330" y="500" width="500" height="58" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="580" y="522" text-anchor="middle" class="t">Feature extraction — 39 features</text>
  <text x="580" y="540" text-anchor="middle" class="mono">extract_email_features()</text>
  <text x="580" y="553" text-anchor="middle" class="s">the same function is used for training and for live inference</text>

  <path class="ln" d="M470 558 L470 586 L250 586 L250 618"/>
  <path class="ln" d="M690 558 L690 586 L910 586 L910 618"/>

  <!-- RULE + ML -->
  <text x="60" y="614" class="hdr">DECIDE</text>
  <rect x="60" y="620" width="380" height="190" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="250" y="643" text-anchor="middle" class="t">Rule-based engine</text>
  <text x="250" y="660" text-anchor="middle" class="mono">calculate_phishing_score()</text>
  <text x="95"  y="684" class="s">Suspicious sender</text><text x="405" y="684" text-anchor="end" class="lbl">+15</text>
  <text x="95"  y="702" class="s">Urgency language</text><text x="405" y="702" text-anchor="end" class="lbl">+10</text>
  <text x="95"  y="720" class="s">Credential request</text><text x="405" y="720" text-anchor="end" class="lbl">+20</text>
  <text x="95"  y="738" class="s">Suspicious URL</text><text x="405" y="738" text-anchor="end" class="lbl">+20</text>
  <text x="95"  y="756" class="s">Suspicious attachment</text><text x="405" y="756" text-anchor="end" class="lbl">+25</text>
  <text x="95"  y="774" class="s">Generic greeting</text><text x="405" y="774" text-anchor="end" class="lbl">+5</text>
  <text x="95"  y="792" class="s">Threat / fear language</text><text x="405" y="792" text-anchor="end" class="lbl">+10</text>
  <line x1="88" y1="799" x2="412" y2="799" stroke="#3b82f6" stroke-width="1"/>
  <text x="250" y="806" text-anchor="middle" class="mono">raw max 105  →  capped 100</text>

  <rect x="720" y="620" width="380" height="190" class="box" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="910" y="643" text-anchor="middle" class="t">Machine learning</text>
  <text x="910" y="660" text-anchor="middle" class="mono">ml_service.predict_email()</text>
  <text x="910" y="686" text-anchor="middle" class="s">TF-IDF 2,725 terms ⊕ 39 scaled features</text>
  <text x="910" y="704" text-anchor="middle" class="s">= 2,764 columns</text>
  <text x="910" y="728" text-anchor="middle" class="s">LogReg · <tspan font-weight="700" fill="#7e22ce">Naive Bayes</tspan> · Random Forest</text>
  <text x="910" y="746" text-anchor="middle" class="s">selected on validation F1 = 0.9655</text>
  <text x="910" y="770" text-anchor="middle" class="mono">test F1 0.9535 · ROC-AUC 0.9916</text>
  <text x="910" y="794" text-anchor="middle" class="s">absent model → rules still work</text>

  <path class="ln" d="M250 810 L250 838 L580 838 L580 866"/>
  <path class="ln" d="M910 810 L910 838 L580 838"/>

  <!-- HYBRID -->
  <rect x="380" y="868" width="400" height="48" class="box" fill="#cffafe" stroke="#06b6d4"/>
  <text x="580" y="889" text-anchor="middle" class="t">Hybrid score</text>
  <text x="580" y="907" text-anchor="middle" class="mono">0.6 × rule + 0.4 × ML × 100</text>
  <path class="ln" d="M580 916 L580 944"/>

  <!-- CLASSIFY -->
  <text x="60" y="968" class="hdr">EXPLAIN</text>
  <rect x="180" y="946" width="800" height="92" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="580" y="968" text-anchor="middle" class="t">Risk score 0–100 → classification → explainable findings → recommendations</text>
  <rect x="210" y="980" width="170" height="26" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="295" y="998" text-anchor="middle" class="s"><tspan font-weight="700">0–20</tspan>  LOW RISK</text>
  <rect x="398" y="980" width="170" height="26" rx="5" fill="#fef9c3" stroke="#eab308"/>
  <text x="483" y="998" text-anchor="middle" class="s"><tspan font-weight="700">21–40</tspan>  MODERATE</text>
  <rect x="586" y="980" width="170" height="26" rx="5" fill="#ffedd5" stroke="#f97316"/>
  <text x="671" y="998" text-anchor="middle" class="s"><tspan font-weight="700">41–70</tspan>  SUSPICIOUS</text>
  <rect x="774" y="980" width="176" height="26" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="862" y="998" text-anchor="middle" class="s"><tspan font-weight="700">71–100</tspan>  HIGH RISK</text>
  <text x="580" y="1026" text-anchor="middle" class="s">every point traces to a named rule, its weight and the quoted evidence</text>
  <path class="ln" d="M580 1038 L580 1062"/>

  <!-- STORE -->
  <text x="60" y="1086" class="hdr">STORE</text>
  <rect x="180" y="1064" width="800" height="48" class="box" fill="#e2e8f0" stroke="#64748b"/>
  <text x="580" y="1084" text-anchor="middle" class="t">SQLite — analyses ◄ indicators · url_analyses (CASCADE)</text>
  <text x="580" y="1102" text-anchor="middle" class="s">URLs stored defanged · raw body NOT stored by default · sender domain only</text>
  <path class="ln" d="M580 1112 L580 1136"/>

  <!-- SERVE -->
  <text x="60" y="1160" class="hdr">SERVE</text>
  <rect x="180" y="1138" width="800" height="50" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="580" y="1158" text-anchor="middle" class="t">FastAPI (Swagger /docs)  →  React dashboard  →  Awareness module</text>
  <text x="580" y="1176" text-anchor="middle" class="s">Dashboard · Email Analyzer · Awareness · History  —  browser uses relative paths, Vite proxies /api</text>
</svg>
